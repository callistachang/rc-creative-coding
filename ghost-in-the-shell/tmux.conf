set -g status-interval 1
set -g status-right-length 40
set -g status-style 'bg=#050E08,fg=#B6D8BE'

set-environment -gF GHOST_DIR '#{d:current_file}'
set -g status-right '#[fg=#64C879]✧ #[fg=#9FFFAD,bold]#(python3 "$GHOST_DIR/main.py")#[fg=#64C879,nobold] ✧#[default]'

bind-key -n Enter send-keys Enter \; set-option -gF @ghost_burst '#{client_activity}'